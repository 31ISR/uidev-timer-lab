<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Секундомер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <h1>Секундомер</h1>


    <div class="circles">
      <div class="circle-block">
        <svg class="progress-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-progress" id="hours-circle"
                  cx="60" cy="60" r="52" stroke-dasharray="0 327"></circle>
        </svg>
        <span class="circle-value" id="hours">00</span>
        <span class="circle-label">чaсы</span>
      </div>

      <div class="circle-block">
        <svg class="progress-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-progress" id="minutes-circle"
                  cx="60" cy="60" r="52" stroke-dasharray="0 327"></circle>
        </svg>
        <span class="circle-value" id="minutes">00</span>
        <span class="circle-label">минуты</span>
      </div>

      <div class="circle-block">
        <svg class="progress-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-progress" id="seconds-circle"
                  cx="60" cy="60" r="52" stroke-dasharray="0 327"></circle>
        </svg>
        <span class="circle-value" id="seconds">00</span>
        <span class="circle-label">секунды</span>
      </div>
    </div>

   
    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="lapBtn" disabled>Lap</button>
      <button id="resetBtn">Reset</button>
    </div>


    <div class="laps" id="lapsContainer" style="display: none;">
      <h2>Круги</h2>
      <div id="lapList"></div>
    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
